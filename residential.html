<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gulf ProClean — residential cleaning</title>
<script src="./ds-base.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Libre Franklin', system-ui, sans-serif; text-wrap: pretty; }
  a { text-decoration: none; }
  #root { min-height: 100vh; }
  @media (max-width: 720px) {
    nav { flex-wrap: wrap; row-gap: 6px !important; column-gap: 14px !important; padding: 12px 20px !important; font-size: 12.5px !important; }
    .calc-two-col { grid-template-columns: 1fr !important; }
    table { font-size: 13px; }
    .addons-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    nav { column-gap: 10px !important; font-size: 11.5px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  try {
    const src = await (await fetch('tweaks-panel.jsx')).text();
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  } catch (e) { console.error('tweaks-panel.jsx failed:', e); }
  try {
    const src = document.getElementById('app-script').textContent;
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  } catch (e) { console.error('app script failed:', e); }
})();
</script>
<script type="text/plain" id="app-script">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": ["#153238", "#b68235"],
  "defaultBooking": "Subscription",
  "heroPhoto": true
}/*EDITMODE-END*/;

const CREAM = "#f5f2ec";

function Nav({ navy, gold }) {
  const links = [["Home", "index.html"], ["Service Tiers", "#tiers"], ["Plans", "#plans"], ["Add-Ons", "#addons"], ["Pricing", "#pricing"], ["Get a Quote", "#calculator"], ["My Account", "account.html"], ["Commercial →", "commercial.html"]];
  return (
    <nav style={{ position: "sticky", top: 0, zIndex: 50, display: "flex", alignItems: "center", gap: 28, padding: "18px clamp(20px,5vw,56px)", color: navy, fontSize: 14, background: CREAM, borderBottom: "1px solid #e3ded2" }}>
      <span style={{ display: "flex", alignItems: "center", gap: 10, fontWeight: 600, fontSize: 15, letterSpacing: "0.06em", marginRight: "auto" }}>
        <span style={{ width: 18, height: 1, background: navy, display: "inline-block" }} />
        GULF PROCLEAN
      </span>
      {links.map(([label, href]) => (
        <a key={label} href={href} style={{ color: "inherit", opacity: 0.92 }}>{label}</a>
      ))}
    </nav>
  );
}

function Hero({ navy, gold, heroPhoto, hero }) {
  const headline = (
    <h1 style={{ fontFamily: "'Libre Franklin', sans-serif", fontWeight: 300, fontSize: "clamp(40px, 6vw, 74px)", lineHeight: 1.08, letterSpacing: "-0.01em", margin: 0, color: heroPhoto ? "#fff" : navy, maxWidth: 780 }}>
      {hero.headline}
    </h1>
  );
  const subhead = (
    <p style={{ display: "block", color: heroPhoto ? "#fff" : navy, fontWeight: 500, fontSize: 17, lineHeight: 1.5, marginTop: 28, maxWidth: 620, textShadow: heroPhoto ? "0 1px 3px rgba(0,0,0,0.35)" : "none" }}>
      {hero.subhead}
    </p>
  );
  const bookNow = (
    <a href="#calculator" style={{ display: "inline-block", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 15, fontWeight: 600, padding: "14px 30px", borderRadius: 3, marginTop: 28, background: gold, color: navy }}>{hero.ctaLabel}</a>
  );
  const ctaRow = (
    <div style={{ display: "flex", alignItems: "center", gap: 22, marginTop: 22, flexWrap: "wrap" }}>
      <a href="#pricing" style={{ background: gold, color: navy, fontWeight: 600, fontSize: 16, padding: "14px 24px", borderRadius: 3, display: "inline-flex", alignItems: "center", gap: 8 }}>See pricing →</a>
      <a href="#plans" style={{ color: heroPhoto ? "#fff" : navy, fontWeight: 500, fontSize: 16, textDecoration: "underline" }}>Explore service tiers</a>
    </div>
  );
  if (!heroPhoto) {
    return (
      <header style={{ background: CREAM, padding: "0 clamp(20px,5vw,56px) 64px" }}>
        <div style={{ paddingTop: 48 }}>{headline}{subhead}<div>{bookNow}</div>{ctaRow}</div>
      </header>
    );
  }
  return (
    <header style={{ position: "relative", minHeight: "min(960px, 100vh)", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <img src="assets/residential-hero.jpg" alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(20,30,32,0.55) 0%, rgba(20,30,32,0.15) 40%, rgba(20,30,32,0.6) 100%)" }} />
      <div style={{ position: "relative", zIndex: 5, flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-end", padding: "40px clamp(20px,5vw,56px) 56px" }}>
        {headline}{subhead}<div>{bookNow}</div>{ctaRow}
      </div>
    </header>
  );
}

function Kicker({ children, gold }) {
  return <span style={{ display: "block", fontSize: 13, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: gold, marginBottom: 14 }}>{children}</span>;
}

function Services({ navy, items }) {
  return (
    <section id="services" style={{ padding: "56px clamp(20px,5vw,56px)", maxWidth: 1200, margin: "0 auto" }}>
      <Kicker gold="#8a6221">What we clean</Kicker>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 40, marginTop: 8 }}>
        {items.map(({ title, body }) => (
          <div key={title} style={{ borderTop: `2px solid ${navy}`, paddingTop: 18 }}>
            <h3 style={{ fontFamily: "inherit", fontWeight: 500, fontSize: 22, color: navy, margin: 0 }}>{title}</h3>
            <p style={{ fontSize: 15.5, lineHeight: 1.65, color: "#3d4a4d", marginTop: 12 }}>{body}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function ServiceTiers({ navy, gold }) {
  const groups = [
    ["Essential Clean", ["Kitchen surfaces", "Bathrooms", "Floors", "Dusting", "Countertops", "Mirrors", "Sinks", "Toilets", "General tidying", "Trash", "High-touch surfaces"]],
    ["Preferred Clean", ["Baseboards", "Doors", "Cabinet fronts", "Ceiling fans", "Detailed dusting", "Under/behind accessible furniture", "Detailed bathroom & kitchen"]],
    ["Premium", ["External kitchen appliances", "Detailed baseboards", "Vents", "Blinds", "Door frames", "Wall spot cleaning", "Heavy buildup", "Detailed fixtures", "Interior cabinets where applicable"]]
  ];
  const tierNames = groups.map(g => g[0]);
  const rows = groups.flatMap(([tier, items]) => items.map(item => ({ item, from: tierNames.indexOf(tier) })));
  return (
    <section id="tiers" style={{ padding: "56px clamp(20px,5vw,56px)", maxWidth: 1200, margin: "0 auto" }}>
      <Kicker gold="#8a6221">Service tiers</Kicker>
      <h2 style={{ fontFamily: "inherit", fontWeight: 300, fontSize: 32, color: navy, margin: 0, maxWidth: 640 }}>Choose how deep we go</h2>
      <p style={{ fontSize: 14, color: "#7a746a", marginTop: 10 }}>Every tier includes everything in the tier before it — compare all three at a glance.</p>
      <div style={{ overflowX: "auto", marginTop: 32 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 620 }}>
          <thead>
            <tr>
              <th style={{ textAlign: "left", fontSize: 13, color: "#7a746a", fontWeight: 500, padding: "0 16px 12px 0", borderBottom: `2px solid ${navy}` }}>Included</th>
              {tierNames.map(name => (
                <th key={name} style={{ textAlign: "center", fontSize: 15, color: navy, fontWeight: 600, padding: "0 16px 12px", borderBottom: `2px solid ${navy}` }}>{name}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(({ item, from }) => (
              <tr key={item}>
                <td style={{ fontSize: 14, color: navy, padding: "10px 16px 10px 0", borderBottom: "1px solid #e3ded2" }}>{item}</td>
                {tierNames.map((name, i) => (
                  <td key={name} style={{ textAlign: "center", padding: "10px 16px", borderBottom: "1px solid #e3ded2" }}>
                    {i >= from && <span style={{ color: gold, fontWeight: 700 }}>✓</span>}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );
}

function PlanList({ items, gold }) {
  return (
    <ul style={{ listStyle: "none", margin: "14px 0 0", padding: 0, fontSize: 14, color: "#3d4a4d" }}>
      {items.map(i => (<li key={i} style={{ padding: "4px 0", display: "flex", gap: 8 }}><span style={{ color: gold }}>—</span>{i}</li>))}
    </ul>
  );
}

function Plans({ navy, gold, booking, setBooking }) {

    ["Essential", null, "Second homes · Snowbirds · Light-use", "$165", "1 cleaning / month · monthly cadence",

    ["Preferred", null, "Families · Primary residences · Pets", "$185", "2 cleanings / month · biweekly cadence",
      ["2 cleanings per month", "Best value — most chosen", "Price by property size", "Skip & reschedule anytime", "Cloud-synced schedule"]],
    ["Premium", "Most popular", "Luxury homes · Executives · High-use", "$205", "4 cleanings / month · weekly cadence",
      ["4 cleanings per month", "Luxury & high-use homes", "Price by property size", "Priority arrival windows", "Cloud-synced schedule"]]
  ];
  return (
    <section id="plans" style={{ background: CREAM, padding: "56px clamp(20px,5vw,56px)" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <Kicker gold="#8a6221">Booking</Kicker>
        <div style={{ position: "relative", background: `linear-gradient(135deg, ${gold}, #d9a94a)`, color: navy, borderRadius: 6, padding: "16px 26px", marginTop: 8, marginBottom: 28, display: "inline-flex", alignItems: "center", gap: 12, fontSize: 15.5, fontWeight: 700, boxShadow: `0 8px 28px ${gold}55`, border: `1px solid ${navy}22`, letterSpacing: "0.01em" }}>
          <span style={{ fontSize: 20, lineHeight: 1 }}>✦</span>
          First-time customers save 10% on any plan — limited time only
          <span style={{ fontSize: 20, lineHeight: 1 }}>✦</span>
        </div>
        <h2 style={{ fontFamily: "inherit", fontWeight: 300, fontSize: 36, color: navy, margin: 0, maxWidth: 640 }}>Book once, or let us handle it on repeat</h2>
        <p style={{ fontSize: 14, color: "#7a746a", marginTop: 10 }}>Pricing scales with property size — <a href="#pricing" style={{ color: "#8a6221" }}>see tier pricing</a> for your square footage.</p>

        <div onClick={() => setBooking("One-Time")} style={{ border: `1px solid ${booking === "One-Time" ? gold : "#d8d3c8"}`, boxShadow: booking === "One-Time" ? `0 0 0 3px ${gold}22` : "none", borderRadius: 6, padding: "28px 30px", background: "#fff", cursor: "pointer", marginTop: 44 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24, flexWrap: "wrap" }}>
            <div>
              <h3 style={{ fontFamily: "inherit", fontWeight: 500, fontSize: 22, color: navy, margin: 0 }}>One-time clean</h3>
              <p style={{ fontSize: 14.5, lineHeight: 1.6, color: "#3d4a4d", marginTop: 8, maxWidth: "56ch" }}>A single visit — move-in, move-out, a deep clean before guests or a big event. No commitment, scheduled around your date.</p>
            </div>
            <a href="#pricing" style={{ flex: "none", border: `1px solid ${navy}`, color: navy, fontWeight: 600, fontSize: 14, padding: "11px 20px", borderRadius: 3 }}>See one-time pricing</a>
          </div>
          <div style={{ display: "flex", gap: 24, marginTop: 20, flexWrap: "wrap" }}>
            {subs.map(([name, , , price]) => (
              <div key={name}>
                <p style={{ fontSize: 12.5, color: "#7a746a", margin: 0 }}>{name}</p>
                <p style={{ fontSize: 18, fontWeight: 600, color: "#8a6221", margin: "2px 0 0" }}>Starting at ${Math.round(parseInt(price.slice(1), 10) * 1.3)}<span style={{ fontSize: 12, fontWeight: 400, color: "#7a746a" }}> / visit</span></p>
              </div>
            ))}
          </div>
        </div>

        <p style={{ fontSize: 20, fontWeight: 500, color: navy, marginTop: 56, marginBottom: 0 }}>Recurring plans</p>
        <p style={{ fontSize: 14.5, color: "#7a746a", marginTop: 8, maxWidth: "56ch" }}>Standing coverage for second homes, primary residences and high-use properties, billed monthly. No contracts — cancel anytime.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 28, marginTop: 28 }} onClick={() => setBooking("Subscription")}>
          {subs.map(([name, badge, audience, price, cadence, features]) => (
            <div key={name} style={{ border: `1px solid ${badge ? gold : (booking === "Subscription" ? gold : "#d8d3c8")}`, boxShadow: badge ? `0 0 0 3px ${gold}22` : "none", borderRadius: 6, padding: "30px 26px", background: "#fff", cursor: "pointer", position: "relative" }}>
              {badge && <span style={{ position: "absolute", top: -12, left: 26, background: gold, color: navy, fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", padding: "4px 10px", borderRadius: 20 }}>{badge}</span>}
              <h4 style={{ fontFamily: "inherit", fontWeight: 500, fontSize: 20, color: navy, margin: 0 }}>{name}</h4>
              <p style={{ fontSize: 12.5, color: "#7a746a", margin: "6px 0 0" }}>{audience}</p>
              <p style={{ margin: "16px 0 0" }}><span style={{ fontSize: 13, fontWeight: 500, color: "#7a746a" }}>Starting at </span><span style={{ fontSize: 26, fontWeight: 600, color: "#8a6221" }}>{price}</span><span style={{ fontSize: 13, fontWeight: 400, color: "#7a746a" }}> / visit</span></p>
              <p style={{ fontSize: 12.5, color: "#7a746a", margin: "4px 0 0" }}>{cadence}</p>
              <p style={{ fontSize: 12.5, color: "#8a6221", margin: "6px 0 0", fontWeight: 500 }}>6-month prepay: ${Math.round(parseInt(price.slice(1), 10) * 0.9)} / visit (−10%) · 12-month: ${Math.round(parseInt(price.slice(1), 10) * 0.85)} / visit (−15%)</p>
              <PlanList gold={gold} items={features} />
              <a href="#pricing" style={{ display: "inline-block", marginTop: 22, background: gold, color: navy, fontWeight: 600, fontSize: 14, padding: "11px 20px", borderRadius: 3, width: "100%", textAlign: "center", boxSizing: "border-box" }}>Choose {name}</a>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function AddOns({ navy, gold }) {
  const residential = [
    ["Interior Window Cleaning", "$110"], ["Blinds Dusting", "Ask for quote"], ["Baseboards & Trim Detailing", "$75"],
    ["Light Fixtures & Ceiling Fans", "Ask for quote"], ["Door & Frame Detailing", "Ask for quote"], ["Cabinet Front Detailing", "$100"],
    ["Inside Oven Cleaning", "$40"], ["Inside Refrigerator Cleaning", "$40"], ["Hard Floor Deep Cleaning", "Ask for quote"],
    ["Carpet Deep Cleaning", "Ask for quote"], ["Shower & Tile Deep Cleaning", "Ask for quote"], ["Balcony/Patio Cleaning", "$47"]
  ];
  return (
    <section id="addons" style={{ background: CREAM, padding: "56px clamp(20px,5vw,56px)" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <Kicker gold="#8a6221">Add-ons</Kicker>
        <h2 style={{ fontFamily: "inherit", fontWeight: 300, fontSize: 32, color: navy, margin: 0, maxWidth: 640 }}>Customers on the Emerald Coast are accustomed to add-ons</h2>
        <p style={{ fontSize: 15.5, lineHeight: 1.6, color: "#3d4a4d", marginTop: 14, maxWidth: "58ch" }}>Add exactly what your space needs, on top of any one-time or subscription visit.</p>
        <img src="assets/residential-addons.jpg" alt="Add-on services: interior window cleaning, blinds dusting, baseboards and trim, light fixtures and ceiling fans, door and frame detailing, cabinet fronts, inside oven, inside refrigerator, hard floor deep cleaning, carpet deep cleaning, shower and tile deep cleaning, balcony and patio cleaning" style={{ width: "100%", display: "block", marginTop: 40, borderRadius: 6 }} />
        <div className="addons-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 1, marginTop: 1, border: "1px solid #e3ded2", background: "#e3ded2" }}>
          {residential.map(([name, price]) => (
            <div key={name} style={{ background: "#fff", padding: "16px 18px", textAlign: "center" }}>
              <p style={{ fontSize: 13.5, color: navy, margin: 0, fontWeight: 500 }}>{name}</p>
              <p style={{ fontSize: 20, fontWeight: 600, color: "#8a6221", margin: "6px 0 0" }}>{price}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Quote({ navy, text, caption }) {
  return (
    <section style={{ background: navy, color: "#fff", padding: "56px clamp(20px,5vw,56px)" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <blockquote style={{ fontFamily: "inherit", fontWeight: 300, fontStyle: "italic", fontSize: "clamp(24px,2.6vw,34px)", lineHeight: 1.4, maxWidth: "34ch", margin: 0 }}>
          "{text}"
        </blockquote>
        <figcaption style={{ fontSize: 14.5, opacity: 0.75, marginTop: 24 }}>{caption}</figcaption>
      </div>
    </section>
  );
}

function PricingTable({ navy, gold, pricing }) {
  const tiers = ["Essential", "Preferred", "Premium"];
  return (
    <section id="pricing" style={{ padding: "56px clamp(20px,5vw,56px)", maxWidth: 1200, margin: "0 auto" }}>
      <Kicker gold="#8a6221">Pricing</Kicker>
      <h2 style={{ fontFamily: "inherit", fontWeight: 300, fontSize: 32, color: navy, margin: 0, maxWidth: 640 }}>Tier pricing by property size</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 20, marginTop: 32, marginBottom: 8 }}>
        {[["Essential", "The basics, every visit: kitchens, bathrooms, floors, dusting and tidying."], ["Preferred", "Essential, plus baseboards, doors, cabinet fronts and detailed dusting."], ["Premium", "Preferred, plus external kitchen appliances, vents, blinds and heavy buildup."]].map(([name, blurb]) => (
          <div key={name}><p style={{ fontSize: 14.5, fontWeight: 600, color: navy, margin: 0 }}>{name}</p><p style={{ fontSize: 13, color: "#7a746a", margin: "4px 0 0" }}>{blurb}</p></div>
        ))}
      </div>
      <p style={{ fontSize: 14, color: "#7a746a", marginTop: 10 }}>Per-visit pricing for residential properties — compare all three tiers at a glance.</p>
      <div style={{ overflowX: "auto", marginTop: 32 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
          <thead>
            <tr>
              <th style={{ textAlign: "left", fontSize: 13, color: "#7a746a", fontWeight: 500, padding: "0 16px 12px 0", borderBottom: `2px solid ${navy}` }}>Property size</th>
              {tiers.map(tier => (<th key={tier} style={{ textAlign: "left", fontSize: 15, color: navy, fontWeight: 600, padding: "0 16px 12px", borderBottom: `2px solid ${navy}` }}>{tier}</th>))}
            </tr>
          </thead>
          <tbody>
            {pricing.map((row) => (
              <tr key={row.band_label}>
                <td style={{ fontSize: 14, color: navy, padding: "14px 16px 14px 0", borderBottom: "1px solid #e3ded2" }}>{row.band_label}</td>
                {row.unavailable ? (
                  <td colSpan={3} style={{ fontSize: 14, color: "#3d4a4d", padding: "14px 16px", borderBottom: "1px solid #e3ded2" }}>Priced individually — <a href="mailto:hello@gulfproclean.com" style={{ color: "#8a6221" }}>request a quote</a></td>
                ) : [row.essential, row.preferred, row.premium].map((price, i) => (
                  <td key={tiers[i]} style={{ fontSize: 17, fontWeight: 600, color: "#8a6221", padding: "14px 16px", borderBottom: "1px solid #e3ded2" }}>${Math.round(price).toLocaleString("en-US")}<span style={{ fontSize: 12, fontWeight: 400, color: "#7a746a" }}> /visit</span></td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ marginTop: 32, padding: "16px 20px", background: CREAM, border: "1px solid #e3ded2", borderRadius: 6 }}>
        <p style={{ fontSize: 14.5, fontWeight: 600, color: navy, margin: 0 }}>No contracts. Cancel anytime.*</p>
        <p style={{ fontSize: 12, color: "#7a746a", margin: "6px 0 0" }}>*Applied discount total is deducted from any refund.</p>
      </div>
      <footer style={{ marginTop: 32, fontSize: 13, color: "#7a746a" }}>Gulf ProClean — serving homes and vacation rentals from Pensacola to Panama City Beach.</footer>
    </section>

}

function Contact({ note }) {
  return (
    <section id="contact" style={{ padding: "0 clamp(20px,5vw,56px) 40px", maxWidth: 1200, margin: "0 auto" }}>
      <p style={{ fontSize: 14, color: "#7a746a" }}>{note} <a href="mailto:hello@gulfproclean.com" style={{ color: "#8a6221" }}>request a quote</a>.</p>
    </section>
  );
}

function Calculator({ navy, gold, pricing }) {
  const SIZE_TIERS = pricing.filter(r => !r.unavailable).map(r => ({
    max: r.max_sqft, label: r.band_label,
    prices: { Essential: r.essential, Preferred: r.preferred, Premium: r.premium },
  }));
  const freqAdj = {
    "2 visits monthly (Biweekly Cleaning)": 0,
    "4 visits monthly (Weekly Cleaning)": 0,
    "1 visit weekly": 0,
    "3 visits weekly": 0,
    "4 visits weekly": 0,
    "5 visits weekly": 0,
    "6 visits weekly": 0,
    "7 visits weekly": 0,
  };
  const ONE_TIME_SURCHARGE = 0.30;
  const monthlyDiscountFor = (m) => m >= 12 ? 0.15 : m >= 6 ? 0.10 : 0;
  const MONTH_OPTIONS = [1, 2, 3, 4, 5, 6, 12];
  const addonPricing = {
    "Inside refrigerator": 40, "Inside oven": 40, "Refrigerator + oven": 70,
    "Interior windows (package)": 110, "Baseboard detail": 75, "Inside cabinets": 100,
    "Laundry wash/dry/fold": 35, "Bed linen change": 12, "Pet hair surcharge": 37,
    "Heavy sand removal": 55, "Patio / balcony": 47, "Garage sweep": 62
  };

  const [address, setAddress] = React.useState("");
  const [notes, setNotes] = React.useState("");
  const [tier, setTier] = React.useState("Premium");
  const [sqft, setSqft] = React.useState(1500);
  const [frequency, setFrequency] = React.useState("4 visits monthly (Weekly Cleaning)");
  const [booking, setBooking] = React.useState("Monthly");
  const [months, setMonths] = React.useState(1);
  const [addons, setAddons] = React.useState([]);
  const [addonQty, setAddonQty] = React.useState({});
  const toggleAddon = (name) => setAddons(a => a.includes(name) ? a.filter(x => x !== name) : [...a, name]);
  const setAddonQtyFor = (name, val) => setAddonQty(q => ({ ...q, [name]: Number(val) }));
  const handleBookIt = () => {
    if (!address.trim()) { alert("Enter the service address to book."); return; }
    if (priceUnavailable) { alert("This property size is priced individually — please request a quote instead."); return; }
    sessionStorage.setItem("gpc_booking_draft", JSON.stringify({
      page: "residential",
      address: address.trim(),
      notes: notes.trim(),
      tier, booking, months, frequency, displayFrequency, bookingLabel,
      addons: addons.map(name => ({ name, occurrences: addonOccurrences(name), unitPrice: addonPricing[name], total: addonPricing[name] * addonOccurrences(name) })),
      addonsTotalAmount: totalAddons,
      allAddonPricing: addonPricing,
      afterFrequency, afterBooking, visitsCount, grossTotal,
      taxRate: 0,
    }));

  const afterFrequency = booking === "One-time" ? afterSize : afterSize * (1 + freqAdj[frequency]);
  const addonsTotal = addons.reduce((sum, name) => sum + addonPricing[name], 0);
  const monthlyDiscountPct = booking === "Monthly" ? monthlyDiscountFor(months) : 0;
  const bookingAdjValue = booking === "One-time" ? ONE_TIME_SURCHARGE : -monthlyDiscountPct;
  const afterBooking = afterFrequency * (1 + bookingAdjValue);
  const perVisit = afterBooking;
  const discount = Math.max(0, afterFrequency - perVisit);
  const displayFrequency = booking === "One-time" ? "1 visit" : frequency;

  const grossTotal = (afterFrequency * visitsCount) + totalAddons;
  const finalDiscounted = (perVisit * visitsCount) + totalAddons;

            </label>

          </label>
          <div style={{ background: "rgba(255,255,255,0.06)", borderRadius: 8, padding: "24px 28px", color: "#fff", position: "sticky", top: 20 }}>

                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}><span style={{ color: "rgba(255,255,255,0.55)" }}>Total discount</span><span style={{ color: discount > 0 ? "#9ee6a8" : "rgba(255,255,255,0.55)" }}>{discount > 0 ? `−$${money(discount)}` : "$0"}</span></div>

                <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.12)", display: "flex", flexDirection: "column", gap: 6, fontSize: 13.5 }}>

                  {addons.map(name => (
                    <div key={name} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}><span style={{ color: "rgba(255,255,255,0.55)" }}>+ {name} — {addonOccurrences(name) === visitsCount ? (visitsCount === 1 ? "this visit" : `every visit ×${visitsCount}`) : addonOccurrences(name) === 1 ? "one-time" : `${addonOccurrences(name)} of ${visitsCount} visits`}</span><span style={{ color: "rgba(255,255,255,0.55)" }}>${money(addonPricing[name] * addonOccurrences(name))}</span></div>
                  ))}
                </div>

                <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.12)", display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                  <span style={{ color: "rgba(255,255,255,0.75)" }}>Number of visits</span>
                  <span>× {visitsCount}</span>
                </div>

                {discount > 0 && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.12)" }}>
                    <p style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", margin: 0 }}>Total for {visitsCount} visit{visitsCount === 1 ? "" : "s"}, before discount</p>
                    <p style={{ fontSize: 22, fontWeight: 600, color: "rgba(255,255,255,0.5)", textDecoration: "line-through", margin: "4px 0 0" }}>${money(grossTotal)}</p>
                  </div>
                )}

                <div style={{ borderTop: "1px solid rgba(255,255,255,0.15)", marginTop: 16, paddingTop: 16 }}>
                  <p style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", margin: 0 }}>{discount > 0 ? "Total discounted price" : "Total price"} — {bookingLabel}, {displayFrequency}</p>
                  <p style={{ fontSize: 40, fontWeight: 600, color: gold, margin: "6px 0 0" }}>${money(finalDiscounted)}</p>
                </div>
              </>
            )}
            <button type="button" onClick={handleBookIt} style={{ display: "inline-block", marginTop: 18, background: gold, color: navy, fontWeight: 600, fontSize: 14, padding: "11px 20px", borderRadius: 3, border: "none", cursor: "pointer" }}>Book It</button>
            <p style={{ fontSize: 11.5, color: "rgba(255,255,255,0.5)", marginTop: 10 }}>You'll create an account and pick a visit time next. First-time discounts are confirmed there.</p>
          </div>
        </div>
      </div>
    </section>
  );
}

function Reveal({ children, delay = 0, order }) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(18px)", transition: `opacity 0.6s ease ${delay}s, transform 0.6s ease ${delay}s`, order, display: "flex", flexDirection: "column", height: "100%" }}>
      {children}
    </div>
  );
}
