<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gulf ProClean — residential cleaning</title>
<meta name="description" content="Standard and deep cleaning, vacation rental turnovers and move-in/move-out cleans for homes and condos from Pensacola to Panama City Beach." />
<script src="./ds-base.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Libre Franklin', system-ui, sans-serif; text-wrap: pretty; background: #f5f2ec; }
  a { text-decoration: none; }
  #root { min-height: 100vh; }
  @media (max-width: 720px) {
    nav { flex-wrap: wrap; row-gap: 6px !important; column-gap: 14px !important; padding: 12px 20px !important; font-size: 12.5px !important; }
    .calc-two-col { grid-template-columns: 1fr !important; }
    table { font-size: 13px; }
    .addons-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    nav { column-gap: 10px !important; font-size: 11.5px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Every marketing page is assembled from the same JSX modules plus its own
// app-script. They are concatenated and evaluated as ONE script on purpose:
// `const` declarations inside an indirect eval stay in that eval's own lexical
// scope, so separate evals would not see each other's constants.
(async () => {
  const MODULES = ["tweaks-panel.jsx", "gulfproclean-shared.jsx"];
  try {
    const parts = await Promise.all(MODULES.map(p => fetch(p).then(r => {
      if (!r.ok) throw new Error('could not load ' + p);
      return r.text();
    })));
    parts.push(document.getElementById('app-script').textContent);
    const code = Babel.transform(parts.join('\n'), { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(code);
  } catch (e) {
    console.error('page failed to load:', e);
    document.getElementById('root').innerHTML =
      '<p style="padding:56px 24px;font:16px/1.6 system-ui;color:#153238">This page could not load. Please refresh, or <a href="contact.html" style="color:#8a6221">contact us</a>.</p>';
  }
})();
</script>
<script type="text/plain" id="app-script">

// residential.html is now the overview page for the residential side. The sections that used to
// scroll underneath it — service tiers, plans, add-ons, the quote calculator, the Home Operating System —
// each live on their own page now and are listed by <SectionIndex>. Their code
// is in residential-sections.jsx.

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": ["#153238", "#b68235"],
  "heroPhoto": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [navy, gold] = t.palette;
  const content = useSiteContent('residential', DEFAULT_CONTENT_RESIDENTIAL);
  useLegacyAnchorRedirect('residential');

  return (
    <div style={{ background: CREAM }}>
      <Nav navy={navy} gold={gold} side="residential" active="residential.html" />
      <PromoBanner navy={navy} gold={gold} />
      <Hero navy={navy} gold={gold} heroPhoto={t.heroPhoto} hero={content.hero}
            image="assets/residential-hero.jpg" quoteHref="residential-quote.html" tiersHref="residential-tiers.html" />
      <Services navy={navy} items={content.services} />
      <SectionIndex side="residential" navy={navy} gold={gold} />
      <Quote navy={navy} text={content.quote.text} caption={content.quote.caption} />
      <SiteFooter side="residential" />
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Palette" value={t.palette}
          options={[["#153238", "#b68235"], ["#201f1d", "#b68235"], ["#2d3f47", "#c9a227"]]}
          onChange={(v) => setTweak('palette', v)} />
        <TweakToggle label="Full-bleed photo hero" value={t.heroPhoto}
          onChange={(v) => setTweak('heroPhoto', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
