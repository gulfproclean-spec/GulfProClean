<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gulf ProClean — book your service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Libre Franklin', system-ui, sans-serif; background: #f5f2ec; color: #153238; }
  a { text-decoration: none; }
  nav { position: sticky; top: 0; z-index: 50; background: #f5f2ec; border-bottom: 1px solid #d8d3c8; display: flex; align-items: center; gap: 10px; padding: 18px clamp(20px,5vw,56px); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; }
  main { max-width: 640px; margin: 0 auto; padding: 40px clamp(20px,5vw,56px) 80px; }
  h1 { font-weight: 300; font-size: 32px; margin: 0 0 8px; }
  .step-label { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8a6221; margin-bottom: 10px; }
  .card { background: #fff; border: 1px solid #d8d3c8; border-radius: 8px; padding: 28px; margin-top: 20px; }
  label { display: block; font-size: 13px; color: #7a746a; margin-bottom: 6px; }
  input, select { width: 100%; min-height: 40px; padding: 8px 12px; font-size: 14px; border: 1px solid #d8d3c8; border-radius: 4px; font-family: inherit; margin-bottom: 16px; }
  button { background: #b68235; color: #153238; font-weight: 600; border: none; border-radius: 4px; padding: 12px 22px; cursor: pointer; font-size: 14px; }
  button.secondary { background: transparent; color: #153238; border: 1px solid #d8d3c8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 10px; text-align: center; border: 1px solid #d8d3c8; cursor: pointer; font-size: 13.5px; font-weight: 500; background: #fff; }
  .tab.active { background: #153238; color: #fff; border-color: #153238; }
  .error { color: #b3261e; font-size: 13px; margin-top: -8px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
  .muted { color: #7a746a; }
  .struck { text-decoration: line-through; color: #7a746a; }
  .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .day-btn { border: 1px solid #d8d3c8; border-radius: 4px; padding: 10px 6px; background: #fff; cursor: pointer; font-size: 12.5px; text-align: center; }
  .day-btn.selected { background: #b68235; border-color: #b68235; color: #153238; font-weight: 600; }
  .day-btn:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>
<nav><span style="width:18px;height:1px;background:#153238;display:inline-block;"></span>GULF PROCLEAN</nav>
<div style="background:linear-gradient(135deg,#b68235,#d9a94a);color:#153238;text-align:center;padding:13px 20px;font-weight:700;font-size:14.5px;letter-spacing:0.02em;">✦ No contracts. Cancel anytime. ✦</div>
<main id="app"></main>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const params = new URLSearchParams(location.search);
const returningBookingId = params.get('bookingId');
const returningSessionId = params.get('session_id');
const returningCanceled = params.get('canceled') === '1';

let draft = null;
try { draft = JSON.parse(sessionStorage.getItem('gpc_booking_draft') || 'null'); } catch {}

let state = {
  step: returningBookingId ? 'payment' : (draft ? 'account' : 'missing'),
  email: null, isFirstTime: null, schedule: null,
  selectedDate: null, selectedTime: null,
  addonsApplied: draft && draft.addons ? draft.addons.map(a => a.name) : [],
  extraAddons: [],
  agreed: false,
  paymentBooking: null, paymentStatus: null, paymentError: null,
};

function money(n) { return '$' + Math.round(n).toLocaleString(); }

function addonLabel(a, visitsCount) {
  if (a.occurrences >= visitsCount) return visitsCount === 1 ? 'this visit' : `every visit ×${visitsCount}`;
  if (a.occurrences === 1) return 'one-time';
  return `${a.occurrences} of ${visitsCount} visits`;
}

function computeTotals() {
  const perVisit = draft.afterBooking * (state.isFirstTime ? 0.90 : 1);
  const totalAddons = draft.addonsTotalAmount;
  const extraAddonsTotal = (state.extraAddons || []).reduce((s, name) => s + ((draft.allAddonPricing && draft.allAddonPricing[name]) || 0), 0);
  const plannedSubtotal = perVisit * draft.visitsCount + totalAddons;
  const subtotal = plannedSubtotal + extraAddonsTotal;
  const grossTotal = draft.grossTotal;
  const discount = Math.max(0, grossTotal - plannedSubtotal);
  const taxRate = draft.taxRate || 0;
  const tax = subtotal * taxRate;
  const finalTotal = subtotal + tax;
  return { perVisit, totalAddons, extraAddonsTotal, subtotal, grossTotal, discount, tax, taxRate, finalTotal };
}

function addMonths(date, months) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}

function billingPlanLabel() {
  if (draft.booking === 'One-time') return 'One-Time';
  if (draft.months >= 12) return '12-Month Subscription — 15% discount';
  if (draft.months >= 6) return '6-Month Subscription — 10% discount';
  return 'Monthly, No-Commitment — 5% discount';
}

// Auto-filled entirely from what was already captured at the estimate step
// (draft) plus the account email and the day/time picked on this page —
// nothing here is information the customer hasn't already provided.
function agreementSummaryHtml() {
  const totals = computeTotals();
  const standardPrice = draft.afterFrequency * 1.30;
  const commitmentEnd = (draft.booking === 'Monthly' && draft.months >= 6 && state.selectedDate)
    ? addMonths(state.selectedDate, draft.months).toLocaleDateString()
    : null;
  return `
    <div style="margin-top:12px">
      <p style="font-size:12.5px;font-weight:500;margin:0 0 6px">Service &amp; subscription information</p>
      <div class="row"><span class="muted">Client</span><span>${draft.firstName} ${draft.lastName}</span></div>
      <div class="row"><span class="muted">Email</span><span>${state.email}</span></div>
      <div class="row"><span class="muted">Property type</span><span>${draft.page === 'residential' ? 'Residential' : 'Commercial'}</span></div>
      <div class="row"><span class="muted">Billing plan</span><span>${billingPlanLabel()}</span></div>
      <div class="row"><span class="muted">Service frequency</span><span>${draft.displayFrequency}</span></div>
      <div class="row"><span class="muted">One-Time/Standard price (per visit)</span><span>${money(standardPrice)}</span></div>
      <div class="row"><span class="muted">Your price (per visit)</span><span>${money(totals.perVisit)}</span></div>
      ${state.selectedDate ? `<div class="row"><span class="muted">First visit</span><span>${state.selectedDate.toLocaleDateString()}</span></div>` : ''}
      ${commitmentEnd ? `<div class="row"><span class="muted">Commitment ends</span><span>${commitmentEnd}</span></div>` : ''}
      <div class="row"><span class="muted">Cancellation</span><span>Anytime</span></div>
    </div>
  `;
}

  return `
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid #e3ded2">
      <p style="font-size:13px;font-weight:500;margin:0 0 4px">Service agreement</p>
      <p class="muted" style="font-size:12px;margin:0 0 10px">Review the terms below before confirming your booking.</p>
      <details style="border:1px solid #d8d3c8;border-radius:4px;padding:10px 14px">
        <summary style="cursor:pointer;font-size:13px;font-weight:500">Read the full Gulf ProClean Service Agreement</summary>

      <label style="display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:13px;color:#153238">

function render() {
  if (state.step === 'missing') {
    app.innerHTML = `
      <h1>Start a quote first</h1>
      <p class="muted">We couldn't find a saved quote. Head back to the residential or commercial page, use the calculator, and click "Book It" to get here.</p>
      <a href="residential.html"><button>Go to residential</button></a>
    `;
    return;
  }
  if (state.step === 'payment') renderPaymentReturn();
  else if (state.step === 'account') renderAccount();
  else if (state.step === 'schedule') renderSchedule();
}

function renderAccount() {
  app.innerHTML = `
    <div class="step-label">Step 1 of 3</div>
    <h1>Create your account</h1>
    <p class="muted">${draft.tier} · ${draft.booking} · ${draft.displayFrequency} at ${draft.address}</p>
    <div class="card">
      <div class="tabs">
        <div class="tab ${state.mode !== 'login' ? 'active' : ''}" id="tab-signup">New customer</div>
        <div class="tab ${state.mode === 'login' ? 'active' : ''}" id="tab-login">I have an account</div>
      </div>
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" value="${state.emailInput || ''}" />
      <label>Password</label>
      <input type="password" id="password" placeholder="${state.mode === 'login' ? 'Your password' : 'At least 8 characters'}" />
      <div class="error" id="err" style="display:none"></div>
      <button id="submit">${state.mode === 'login' ? 'Log in' : 'Create account & continue'}</button>
    </div>
  `;
  $('#tab-signup').onclick = () => { state.mode = 'signup'; render(); };
  $('#tab-login').onclick = () => { state.mode = 'login'; render(); };
  $('#submit').onclick = submitAccount;
}

async function submitAccount() {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const errEl = $('#err');
  errEl.style.display = 'none';
  const btn = $('#submit');
  btn.disabled = true;
  try {
    const url = state.mode === 'login' ? '/api/auth/login' : '/api/auth/signup';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    state.email = data.email;
    state.isFirstTime = data.isFirstTime;
    state.step = 'schedule';
    await loadSchedule();
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
  }
}

async function loadSchedule() {
  const res = await fetch('/api/schedule');
  const data = await res.json();
  state.schedule = data.days;
}

const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAY_LABELS = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };

function nextAvailableDays(schedule, count) {
  const out = [];
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  for (let i = 1; out.length < count && i < 60; i++) {
    const day = new Date(d);
    day.setDate(d.getDate() + i);
    const key = DAY_KEYS[day.getDay()];
    const cfg = schedule ? schedule[key] : null;
    if (cfg && cfg.enabled) out.push({ date: day, key, cfg });
  }
  return out;
}

const SLOT_INCREMENT_MIN = 240;

function timeSlots(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const slots = [];
  let h = sh, m = sm;
  while (h < eh || (h === eh && m < em)) {
    slots.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
    m += SLOT_INCREMENT_MIN;
    while (m >= 60) { h += 1; m -= 60; }
  }
  return slots;
}

const MIN_NOTICE_MS = 24 * 60 * 60 * 1000;

function slotDateTime(date, timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const dt = new Date(date);
  dt.setHours(h, m, 0, 0);
  return dt;
}

function availableTimeSlots(date, cfg) {
  return timeSlots(cfg.start, cfg.end).filter(t => slotDateTime(date, t).getTime() - Date.now() >= MIN_NOTICE_MS);
}

function frequencyIntervalDays(page, frequency) {
  const n = parseInt(frequency, 10) || 1;
  if (!frequency.toLowerCase().includes('monthly')) {
    return Math.max(1, Math.round(7 / n));
  }
  if (page === 'residential') {
    if (frequency.includes('4 visits')) return 7;
    if (frequency.includes('2 visits')) return 14;
    return 30;
  }
  return Math.max(1, Math.round(7 / n));
}

function upcomingVisitPreview(anchorDate, page, frequency, visitsCount) {
  const interval = frequencyIntervalDays(page, frequency);
  const count = Math.min(visitsCount, 6);
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(anchorDate);
    d.setDate(d.getDate() + i * interval);
    out.push(d);
  }
  return out;
}

function renderSchedule() {
  const totals = computeTotals();
  const days = nextAvailableDays(state.schedule, 14);
  const selectedDay = days.find(d => d.date.toDateString() === (state.selectedDate && state.selectedDate.toDateString()));
  const hasAddons = draft.addons && draft.addons.length > 0;
  const showRecurringPreview = draft.booking !== 'One-time' && draft.visitsCount > 1 && selectedDay;
  const purchasedNames = new Set((draft.addons || []).map(a => a.name));
  const extraOptions = Object.keys(draft.allAddonPricing || {}).filter(name => !purchasedNames.has(name));
  app.innerHTML = `
    <div class="step-label">Step 2 of 3</div>
    <h1>Pick your visit</h1>
    <p class="muted">Signed in as ${state.email}</p>

    <div class="card">
      <div class="row"><span>${draft.tier} price per visit</span><span>${money(totals.perVisit)}</span></div>
      <div class="row muted" style="font-size:12px">Discounts apply to the visit price only — add-ons are never discounted.</div>
      <div class="row"><span>Add-ons total</span><span>${money(totals.totalAddons)}</span></div>
      ${(draft.addons || []).map(a => `<div class="row muted" style="font-size:12px"><span>+ ${a.name} — ${addonLabel(a, draft.visitsCount)}</span><span>${money(a.total)}</span></div>`).join('')}
      <div class="row"><span>Number of visits</span><span>× ${draft.visitsCount}</span></div>
      ${totals.extraAddonsTotal > 0 ? `<div class="row"><span>Extra add-ons (this visit)</span><span>${money(totals.extraAddonsTotal)}</span></div>` : ''}
      ${totals.discount > 0 ? `<div class="row"><span class="muted">Total before discount</span><span class="struck">${money(totals.grossTotal)}</span></div>` : ''}
      <div class="row" style="font-weight:600;border-top:1px solid #e3ded2;margin-top:8px;padding-top:12px">
        <span>Subtotal ${totals.discount > 0 ? '(discounted)' : ''}</span><span>${money(totals.subtotal)}</span>
      </div>
      ${totals.taxRate > 0 ? `<div class="row"><span class="muted">FL Sales Tax (${Math.round(totals.taxRate * 100)}%)</span><span>${money(totals.tax)}</span></div>` : ''}
      <div class="row" style="font-size:20px;font-weight:600;border-top:1px solid #e3ded2;margin-top:8px;padding-top:12px">
        <span>Total</span><span style="color:#8a6221">${money(totals.finalTotal)}</span>
      </div>
      ${state.isFirstTime ? '<p style="font-size:12.5px;color:#1a7a3d;margin-top:8px">First-time customer — 10% discount applied.</p>' : ''}
    </div>

    <div class="card">
      <label>Choose a day</label>
      <p class="muted" style="font-size:12.5px;margin-top:-6px">Bookings need at least 24 hours' notice. This confirms your first visit; times are offered in 4-hour windows.</p>
      <div class="day-grid">
        ${days.map(d => {
          const hasSlots = availableTimeSlots(d.date, d.cfg).length > 0;
          const isSelected = selectedDay && selectedDay.date.toDateString() === d.date.toDateString();
          return `<button type="button" class="day-btn ${isSelected ? 'selected' : ''}" data-date="${d.date.toISOString()}" ${hasSlots ? '' : 'disabled'}>${DAY_LABELS[d.key]}<br>${d.date.getMonth() + 1}/${d.date.getDate()}</button>`;
        }).join('')}
      </div>
      ${selectedDay ? `
        <label>Choose a time</label>
        <select id="time">
          <option value="">Select a time</option>
          ${availableTimeSlots(selectedDay.date, selectedDay.cfg).map(t => `<option value="${t}" ${state.selectedTime === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      ` : '<p class="muted" style="font-size:13px">Pick a day to see available times.</p>'}
      ${showRecurringPreview ? `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #e3ded2">
          <p style="font-size:13px;font-weight:500;margin:0 0 8px">Upcoming visits at this frequency (${draft.displayFrequency})</p>
          <p class="muted" style="font-size:12px;margin:0 0 8px">Estimated — we'll confirm each date with you directly. Only your first visit is booked now.</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${upcomingVisitPreview(selectedDay.date, draft.page, draft.frequency, draft.visitsCount).map((d, i) => `<span class="tag-date" style="font-size:12px;padding:5px 10px;border:1px solid #d8d3c8;border-radius:20px;background:${i === 0 ? '#b68235' : '#fff'};color:${i === 0 ? '#153238' : '#7a746a'}">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>`).join('')}
            ${draft.visitsCount > 6 ? `<span class="muted" style="font-size:12px;padding:5px 2px">+ ${draft.visitsCount - 6} more</span>` : ''}
          </div>
        </div>
      ` : ''}
      ${hasAddons ? `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #e3ded2">
          <p style="font-size:13px;font-weight:500;margin:0 0 4px">Add-ons for this visit</p>
          <p class="muted" style="font-size:12px;margin:0 0 8px">Uncheck any add-on that doesn't apply to this particular visit. You can't apply more than what you've purchased.</p>
          ${draft.addons.map(a => `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
              <input type="checkbox" data-addon="${a.name}" ${state.addonsApplied.includes(a.name) ? 'checked' : ''} />
              ${a.name} <span class="muted" style="margin-left:auto">${addonLabel(a, draft.visitsCount)} · ${money(a.unitPrice)}</span>
            </label>
          `).join('')}
        </div>
      ` : ''}
      ${extraOptions.length > 0 ? `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #e3ded2">
          <p style="font-size:13px;font-weight:500;margin:0 0 4px">Add an extra service for this visit</p>
          <p class="muted" style="font-size:12px;margin:0 0 8px">Already used up what you paid for, or want something you didn't originally purchase? Add it here — it's charged with this visit's total.</p>
          ${extraOptions.map(name => `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
              <input type="checkbox" data-extra-addon="${name}" ${state.extraAddons.includes(name) ? 'checked' : ''} />
              ${name} <span class="muted" style="margin-left:auto">+${money(draft.allAddonPricing[name])}</span>
            </label>
          `).join('')}
        </div>
      ` : ''}
      ${agreementHtml()}
      <div class="error" id="err" style="display:none"></div>
      <button id="confirm" ${selectedDay && state.selectedTime && state.agreed ? '' : 'disabled'}>Confirm booking</button>
    </div>
  `;
  app.querySelectorAll('.day-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = new Date(btn.getAttribute('data-date'));
      state.selectedTime = null;
      render();
    };
  });
  const timeSel = $('#time');
  if (timeSel) timeSel.onchange = (e) => { state.selectedTime = e.target.value; render(); };
  app.querySelectorAll('[data-addon]').forEach(cb => {
    cb.onchange = (e) => {
      const name = e.target.getAttribute('data-addon');
      state.addonsApplied = e.target.checked
        ? [...new Set([...state.addonsApplied, name])]
        : state.addonsApplied.filter(n => n !== name);
    };
  });
  app.querySelectorAll('[data-extra-addon]').forEach(cb => {
    cb.onchange = (e) => {
      const name = e.target.getAttribute('data-extra-addon');
      state.extraAddons = e.target.checked
        ? [...new Set([...state.extraAddons, name])]
        : state.extraAddons.filter(n => n !== name);
      render();
    };
  });
  const agreeCb = $('#agree-terms');
  if (agreeCb) agreeCb.onchange = (e) => { state.agreed = e.target.checked; render(); };
  const confirmBtn = $('#confirm');
  if (confirmBtn) confirmBtn.onclick = confirmBooking;
}

async function confirmBooking() {
  const btn = $('#confirm');
  const errEl = $('#err');
  btn.disabled = true;
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: draft.page,
        firstName: draft.firstName,
        lastName: draft.lastName,
        phone: draft.phone,
        addressLine1: draft.addressLine1,
        unit: draft.unit,
        city: draft.city,
        state: draft.state,
        zip: draft.zip,
        notes: draft.notes,
        tier: draft.tier,
        bookingType: draft.booking,
        months: draft.months,
        frequency: draft.frequency,
        sqft: draft.sqft,
        restroomBand: draft.restroomBand,
        areas: draft.areas,
        propertyType: draft.propertyType,
        occupancy: draft.occupancy,
        hardFloorPct: draft.hardFloorPct,
        addons: draft.addons.map(a => ({ name: a.name, occurrences: a.occurrences })),
        addonsApplied: state.addonsApplied,
        extraAddons: state.extraAddons.map(name => ({ name })),
        scheduledDate: state.selectedDate.toISOString().slice(0, 10),
        scheduledTime: state.selectedTime,
        agreementAccepted: state.agreed,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    btn.textContent = 'Redirecting to payment…';
    const checkoutRes = await fetch(`/api/bookings/${data.id}/checkout`, { method: 'POST' });
    const checkoutData = await checkoutRes.json();
    if (!checkoutRes.ok) throw new Error(checkoutData.error || 'Could not start payment');
    sessionStorage.removeItem('gpc_booking_draft');
    window.location.href = checkoutData.url;
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Confirm booking';
  }
}

async function retryCheckout(bookingId) {
  const errEl = $('#err');
  try {
    const res = await fetch(`/api/bookings/${bookingId}/checkout`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start payment');
    window.location.href = data.url;
  } catch (e) {
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  }
}

async function loadPaymentBooking() {
  try {
    const res = await fetch(`/api/bookings/${returningBookingId}`);
    const data = await res.json();
    if (res.ok) state.paymentBooking = data.booking;
  } catch {}
}

function renderPaymentReturn() {
  const b = state.paymentBooking;
  if (!state.paymentStatus) {
    app.innerHTML = `<h1>Confirming your payment…</h1><p class="muted">One moment — please don't close this page.</p>`;
    return;
  }
  if (state.paymentStatus === 'paid') {
    app.innerHTML = `
      <div class="step-label">Booked</div>
      <h1>You're booked</h1>
      <div class="card">
        ${b ? `
          <p>${b.tier} clean at ${b.address}${b.scheduled_date ? `, scheduled for ${new Date(b.scheduled_date).toLocaleDateString()} at ${b.scheduled_time}` : ''}.</p>
          <p style="font-size:24px;font-weight:600;color:#8a6221">${money(b.final_total)}</p>
        ` : ''}
        <p class="muted" style="font-size:13px">A confirmation email is on its way${state.email ? ' to ' + state.email : ''} with these details. Need to change the date or time? You can reschedule up until 24 hours before your visit from My Account.</p>
        <p class="muted" style="font-size:12px;margin-top:10px">Need to cancel or request a refund? That's handled under <a href="account.html" style="color:#8a6221">My Account</a>.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <a href="account.html"><button>My Account</button></a>
          ${b ? `<a href="${b.page}.html"><button class="secondary">Back to ${b.page === 'residential' ? 'Residential' : 'Commercial'}</button></a>` : ''}
        </div>
      </div>
    `;
    return;
  }
  if (state.paymentStatus === 'pending') {
    app.innerHTML = `
      <h1>Payment processing</h1>
      <div class="card">
        <p class="muted">Your payment is still processing — this can happen with some payment methods. We'll email you as soon as it's confirmed.</p>
        <a href="account.html"><button>Go to My Account</button></a>
      </div>
    `;
    return;
  }
  // canceled or error
  app.innerHTML = `
    <h1>${state.paymentStatus === 'canceled' ? 'Payment canceled' : 'Something went wrong'}</h1>
    <div class="card">
      <p class="muted">${state.paymentStatus === 'canceled' ? "You didn't complete payment, so this booking hasn't been confirmed yet." : (state.paymentError || 'We could not confirm your payment.')}</p>
      ${b ? `<p style="margin-top:10px">${b.tier} clean at ${b.address} — <strong>${money(b.final_total)}</strong></p>` : ''}
      <div class="error" id="err" style="display:none"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button id="retry-pay">Try payment again</button>
        <a href="account.html"><button class="secondary">Go to My Account</button></a>
      </div>
    </div>
  `;
  const retryBtn = $('#retry-pay');
  if (retryBtn) retryBtn.onclick = () => retryCheckout(returningBookingId);
}

async function handlePaymentReturn() {
  render();
  try {
    const meRes = await fetch('/api/auth/me');
    const me = await meRes.json();
    if (me.loggedIn) state.email = me.email;
  } catch {}

  if (returningCanceled) {
    state.paymentStatus = 'canceled';
    await loadPaymentBooking();
    render();
    return;
  }
  if (!returningSessionId) {
    state.paymentStatus = 'error';
    state.paymentError = 'Missing payment session.';
    await loadPaymentBooking();
    render();
    return;
  }
  try {
    const res = await fetch(`/api/bookings/${returningBookingId}/verify-payment?session_id=${encodeURIComponent(returningSessionId)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not verify payment');
    state.paymentStatus = data.paid ? 'paid' : 'pending';
  } catch (e) {
    state.paymentStatus = 'error';
    state.paymentError = e.message;
  }
  await loadPaymentBooking();
  render();
}

async function init() {
  if (state.step === 'payment') {
    await handlePaymentReturn();
  } else {
    state.mode = 'signup';
    render();
  }
}

init();
</script>
</body>
</html>
