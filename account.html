<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gulf ProClean — my account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Libre Franklin', system-ui, sans-serif; background: #f5f2ec; color: #153238; }
  a { text-decoration: none; }
  nav { position: sticky; top: 0; z-index: 50; background: #f5f2ec; border-bottom: 1px solid #d8d3c8; display: flex; align-items: center; gap: 10px; padding: 18px clamp(20px,5vw,56px); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; }
  main { max-width: 960px; margin: 0 auto; padding: 40px clamp(20px,5vw,56px) 80px; }
  .home-health { background: #153238; border-radius: 12px; padding: 24px 26px; color: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-top: 20px; }
  .home-health .hh-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin: 0; }
  .home-health .hh-score { font-size: 32px; font-weight: 600; color: #b68235; margin: 4px 0 0; }
  .home-health .hh-score span { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.75); }
  .health-tags { display: flex; flex-wrap: wrap; gap: 12px; }
  .health-tag { font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
  .dash-card { background: #fff; border: 1px solid #d8d3c8; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .dash-card .dc-title { font-size: 13.5px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 7px; }
  .dash-card .dc-subtitle { font-size: 12px; color: #7a746a; margin: 2px 0 0; }
  .dash-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .dash-list li { font-size: 12.5px; color: #3d4a4d; display: flex; gap: 6px; }
  .dash-list li:before { content: "•"; color: #8a6221; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; width: fit-content; }
  .status-pill.ok { background: #e8f5ec; color: #1a7a3d; }
  .status-pill.warn { background: #fdf3e3; color: #8a6221; }
  .progress-bar { height: 6px; background: #e3ded2; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .progress-bar > div { height: 100%; background: #b68235; border-radius: 99px; }
  .step-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .step-list li { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .step-list .done { color: #1a7a3d; font-weight: 700; }
  .step-list .current { color: #153238; font-weight: 700; }
  .step-list .upcoming-step { color: #b3aca0; }
  .card-cta { font-size: 12px; font-weight: 600; color: #8a6221; margin-top: auto; display: inline-block; }
  h1 { font-weight: 300; font-size: 32px; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid #d8d3c8; border-radius: 8px; padding: 24px; margin-top: 20px; }
  label { display: block; font-size: 13px; color: #7a746a; margin-bottom: 6px; }
  input, select { width: 100%; min-height: 40px; padding: 8px 12px; font-size: 14px; border: 1px solid #d8d3c8; border-radius: 4px; font-family: inherit; margin-bottom: 16px; }
  button { background: #b68235; color: #153238; font-weight: 600; border: none; border-radius: 4px; padding: 11px 20px; cursor: pointer; font-size: 14px; }
  button.secondary { background: transparent; color: #153238; border: 1px solid #d8d3c8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #b3261e; font-size: 13px; margin-top: -8px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; }
  .muted { color: #7a746a; }
  .booking-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8a6221; background: #f5f2ec; padding: 3px 9px; border-radius: 20px; }
  .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin: 14px 0; }
  .day-btn { border: 1px solid #d8d3c8; border-radius: 4px; padding: 8px 6px; background: #fff; cursor: pointer; font-size: 12px; text-align: center; }
  .day-btn.selected { background: #b68235; border-color: #b68235; color: #153238; font-weight: 600; }
  .terms-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .terms-table th { text-align: left; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: #7a746a; font-weight: 500; padding: 0 12px 10px 0; border-bottom: 2px solid #153238; }
  .terms-table td { padding: 12px 12px 12px 0; border-bottom: 1px solid #e3ded2; color: #153238; }
  .terms-table td:first-child { font-weight: 500; }
  .day-btn:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>
<nav><span style="width:18px;height:1px;background:#153238;display:inline-block;"></span>GULF PROCLEAN</nav>
<main id="app"></main>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const MIN_NOTICE_MS = 24 * 60 * 60 * 1000;
const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAY_LABELS = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };

let state = { step: 'loading', email: null, mode: 'login', bookings: [], schedule: null, reschedulingId: null, selectedDate: null, selectedTime: null, addonPanelId: null, addonSelection: {} };

const RESIDENTIAL_ADDON_CATALOG = {
  "Inside refrigerator": 40, "Inside oven": 40, "Refrigerator + oven": 70,
  "Interior windows (package)": 110, "Baseboard detail": 75, "Inside cabinets": 100,
  "Laundry wash/dry/fold": 35, "Bed linen change": 12, "Pet hair surcharge": 37,
  "Heavy sand removal": 55, "Patio / balcony": 47, "Garage sweep": 62
};

function money(n) { return '$' + Math.round(n).toLocaleString(); }

async function signOut() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
  state.email = null;
  state.bookings = [];
  state.step = 'login';
  render();
}

function combineDateTime(dateStr, timeStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const [h, mi] = timeStr.split(':').map(Number);
  return new Date(y, mo - 1, d, h, mi, 0, 0);
}

function canReschedule(b) {
  if (!b.scheduled_date || !b.scheduled_time) return false;
  const dt = combineDateTime(String(b.scheduled_date).slice(0, 10), b.scheduled_time);
  return dt.getTime() - Date.now() >= MIN_NOTICE_MS;
}

async function init() {
  render();
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.loggedIn) {
      state.email = data.email;
      await loadBookings();
      state.step = 'bookings';
    } else {
      state.step = 'login';
    }
  } catch (e) {
    state.step = 'login';
  }
  render();
}

async function loadBookings() {
  const res = await fetch('/api/bookings');
  const data = await res.json();
  state.bookings = data.bookings || [];
}

async function loadSchedule() {
  if (state.schedule) return;
  const res = await fetch('/api/schedule');
  const data = await res.json();
  state.schedule = data.days;
}

function nextAvailableDays(schedule, count) {
  const out = [];
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  for (let i = 1; out.length < count && i < 60; i++) {
    const day = new Date(d);
    day.setDate(d.getDate() + i);
    const key = DAY_KEYS[day.getDay()];
    const cfg = schedule ? schedule[key] : null;
    if (cfg && cfg.enabled) out.push({ date: day, key, cfg });
  }
  return out;
}

const SLOT_INCREMENT_MIN = 240;

function timeSlots(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const slots = [];
  let h = sh, m = sm;
  while (h < eh || (h === eh && m < em)) {
    slots.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
    m += SLOT_INCREMENT_MIN;
    while (m >= 60) { h += 1; m -= 60; }
  }
  return slots;
}

function slotDateTime(date, timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const dt = new Date(date);
  dt.setHours(h, m, 0, 0);
  return dt;
}

function availableTimeSlots(date, cfg) {
  return timeSlots(cfg.start, cfg.end).filter(t => slotDateTime(date, t).getTime() - Date.now() >= MIN_NOTICE_MS);
}

function render() {
  if (state.step === 'loading') { app.innerHTML = '<p class="muted">Loading…</p>'; return; }
  if (state.step === 'login') return renderLogin();
  if (state.step === 'bookings') return renderBookings();
}

function subscriptionTermsHtml() {
  const rows = [
    ['Standard', 'Month-to-month', '0%', '30-day notice'],
    ['6-Month Subscription', '6 months', '10%', 'Discount reconciliation'],
    ['12-Month Subscription', '12 months', '15%', 'Discount reconciliation'],
  ];
  return `
    <div class="card">
      <p style="font-weight:500;margin:0 0 4px">Subscription Pricing &amp; Early Cancellation</p>
      <p class="muted" style="font-size:13px;margin:0 0 16px">How your plan's discount and cancellation terms work.</p>
      <div style="overflow-x:auto">
        <table class="terms-table">
          <thead><tr><th>Plan</th><th>Commitment</th><th>Discount</th><th>Early Cancellation</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px">"Discount reconciliation" means: if you cancel a 6- or 12-month subscription early, the discount already applied to past visits is reconciled against the standard month-to-month rate for the visits you actually received.</p>
    </div>
  `;
}

function dashCardHtml({ icon, title, subtitle, status, statusText, body }) {
  return `
    <div class="dash-card">
      <div>
        <p class="dc-title"><span>${icon}</span>${title}</p>
        ${subtitle ? `<p class="dc-subtitle">${subtitle}</p>` : ''}
      </div>
      <div>${body}</div>
      ${status ? `<span class="status-pill ${status}">${status === 'ok' ? '✓' : '⚠'} ${statusText}</span>` : ''}
    </div>
  `;
}

function dashListHtml(items) {
  return `<ul class="dash-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}

function stepListHtml(items) {
  const icon = { done: '✓', current: '●', upcoming: '○' };
  const cls = { done: 'done', current: 'current', upcoming: 'upcoming-step' };
  return `<ul class="step-list">${items.map(it => `<li><span class="${cls[it.state]}">${icon[it.state]}</span>${it.label}</li>`).join('')}</ul>`;
}

function homeHealthHtml() {
  const healthTags = [['Cleaning', 'ok'], ['HVAC', 'ok'], ['Pool', 'ok'], ['Supplies', 'warn'], ['Maintenance', 'warn'], ['Upcoming', 'ok']];
  const cards = [
    dashCardHtml({ icon: '🧹', title: 'Cleaning', subtitle: 'Completed today', status: 'ok', statusText: 'Complete', body: dashListHtml(['10:42 AM', 'Quality check completed', '2-person team']) }),
    dashCardHtml({ icon: '🏠', title: 'Home Check', subtitle: 'Property check completed', status: 'ok', statusText: 'No issues found', body: dashListHtml(['Doors & windows checked', 'Water/leak check', 'Thermostat checked']) }),
    dashCardHtml({ icon: '❄️', title: 'HVAC', subtitle: 'Operating normally', status: 'ok', statusText: 'Normal', body: dashListHtml(['Filter: Good', 'Last replaced: Aug. 2', 'Next recommended: Nov. 2']) }),
    dashCardHtml({ icon: '🏊', title: 'Pool', subtitle: 'Operating normally', status: 'ok', statusText: 'Normal', body: dashListHtml(['Water level: Normal', 'Equipment: Normal', 'Cleaning: Scheduled']) }),
    dashCardHtml({ icon: '🧴', title: 'Supplies', subtitle: '2 items need attention', status: 'warn', statusText: 'Needs restock', body: dashListHtml(['Paper towels — Low', 'Dishwasher detergent — Low']) + `<a href="residential.html#calculator" class="card-cta">Review Supplies →</a>` }),
    dashCardHtml({ icon: '🔧', title: 'Maintenance', subtitle: '1 item needs attention', status: 'warn', statusText: 'Needs attention', body: `<p class="dc-subtitle" style="margin-top:8px">Kitchen faucet has a slow drip.</p><a href="residential.html#calculator" class="card-cta">View Issue →</a>` }),
    dashCardHtml({ icon: '📅', title: 'Upcoming', subtitle: 'Next scheduled visits', body: dashListHtml(['Exterior window cleaning — Sept. 15', 'HVAC service — Oct. 3', 'Pool service — Oct. 10']) + `<a href="residential.html#calculator" class="card-cta">View Schedule →</a>` }),
    dashCardHtml({ icon: '🛠', title: 'Projects', subtitle: 'Guest bathroom refresh — 70% complete', body: `<div class="progress-bar"><div style="width:70%"></div></div>` + stepListHtml([
      { label: 'Materials delivered', state: 'done' },
      { label: 'Plumbing completed', state: 'done' },
      { label: 'Tile installation', state: 'current' },
      { label: 'Final cleaning', state: 'upcoming' },
    ]) + `<a href="residential.html#calculator" class="card-cta">View Project →</a>` }),
    dashCardHtml({ icon: '🌪', title: 'Storm Ready', subtitle: 'Storm Watch', body: `<p class="dc-subtitle" style="margin-top:8px">Tropical weather is being monitored for your area.</p><p style="font-size:12.5px;color:#8a6221;font-weight:600;margin:8px 0 0">Storm preparation available</p><a href="residential.html#calculator" class="card-cta">Prepare My Home →</a>` }),
    dashCardHtml({ icon: '✈️', title: 'Arrival', subtitle: 'Next Arrival — Friday · Aug. 22', body: `<p class="dc-subtitle" style="margin-top:8px">Home preparation scheduled</p>` + stepListHtml([
      { label: 'Cleaning complete', state: 'done' },
      { label: 'Beds prepared', state: 'done' },
      { label: 'Thermostat adjusted', state: 'done' },
      { label: 'Essentials stocked', state: 'done' },
      { label: 'Final arrival check', state: 'upcoming' },
    ]) + `<a href="residential.html#calculator" class="card-cta">View Arrival Plan →</a>` }),
  ];
  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:4px">
        <div>
          <p style="font-size:20px;font-weight:600;margin:0;letter-spacing:0.02em">MY HOME</p>
          <p class="muted" style="font-size:13px;margin:4px 0 0">Last updated today</p>
        </div>
        <span style="font-size:12.5px;display:flex;align-items:center;gap:6px;color:#1a7a3d;background:#e8f5ec;padding:6px 12px;border-radius:20px;font-weight:600">● Home operating normally</span>
      </div>
      <div class="home-health">
        <div>
          <p class="hh-label">Home Health</p>
          <p class="hh-score">98%<span> — Operating Normally</span></p>
        </div>
        <div class="health-tags">
          ${healthTags.map(([label, state]) => `<span class="health-tag" style="color:${state === 'ok' ? '#9ee6a8' : '#e8c375'}">${state === 'ok' ? '✓' : '⚠'} <span style="color:rgba(255,255,255,0.85)">${label}</span></span>`).join('')}
        </div>
      </div>
      <div class="dash-grid">${cards.join('')}</div>
    </div>
  `;
}

function renderLogin() {
  app.innerHTML = `
    <h1>My Account</h1>
    <p class="muted">Log in to view or reschedule your bookings.</p>
    <div class="card">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" />
      <div class="error" id="err" style="display:none"></div>
      <button id="submit">Log in</button>
      <p class="muted" style="font-size:12.5px;margin-top:12px">Don't have an account yet? Book a service from the <a href="residential.html" style="color:#8a6221">residential</a> or <a href="commercial.html" style="color:#8a6221">commercial</a> page first.</p>
    </div>
    ${subscriptionTermsHtml()}
  `;
  $('#submit').onclick = async () => {
    const email = $('#email').value.trim();
    const password = $('#password').value;
    const errEl = $('#err');
    errEl.style.display = 'none';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      state.email = data.email;
      await loadBookings();
      state.step = 'bookings';
      render();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  };
}

function renderBookings() {
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <h1>My Account</h1>
        <p class="muted">Signed in as ${state.email}</p>
      </div>
      <button class="secondary" id="signout">Sign out</button>
    </div>
    ${homeHealthHtml()}
    <h1 style="font-size:24px;margin-top:40px">My Bookings</h1>
    ${state.bookings.length === 0 ? '<div class="card"><p class="muted">No bookings yet.</p></div>' : ''}
    <div id="list"></div>
    ${subscriptionTermsHtml()}
  `;
  $('#signout').onclick = signOut;
  const list = $('#list');
  state.bookings.forEach(b => {
    const card = document.createElement('div');
    card.className = 'card';
    const scheduled = b.scheduled_date ? `${new Date(b.scheduled_date).toLocaleDateString()} at ${b.scheduled_time}` : 'Not scheduled';
    const allowed = canReschedule(b);
    const unpaid = b.payment_status && b.payment_status !== 'paid';
    card.innerHTML = `
      <div class="booking-header">
        <div>
          <span class="tag">${b.page === 'residential' ? 'Residential' : 'Commercial'}</span>
          ${unpaid ? '<span class="tag" style="color:#b3261e;background:#fbe9e7">Unpaid</span>' : ''}
          <p style="margin:8px 0 0;font-weight:500">${b.tier} — ${b.address}</p>
          <p class="muted" style="font-size:13px;margin-top:4px">${scheduled}</p>
        </div>
        <p style="font-size:18px;font-weight:600;color:#8a6221;margin:0">${money(b.final_total)}</p>
      </div>
      ${unpaid ? `<p class="muted" style="font-size:12px;margin-top:8px">Payment was never completed for this booking, so it isn't confirmed yet.</p>` : ''}
      ${b.scheduled_date ? monthCalendarHtml(b.scheduled_date, b.scheduled_time) : ''}
      <div class="error" id="pay-err-${b.id}" style="display:none"></div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        ${unpaid ? `<button data-pay-now="${b.id}">Pay now</button>` : ''}
        <button class="secondary" data-reschedule="${b.id}" ${allowed ? '' : 'disabled'}>Reschedule</button>
        ${!unpaid ? `<button class="secondary" data-addon-toggle="${b.id}">Add an add-on</button>` : ''}
      </div>
      ${!allowed ? '<p class="muted" style="font-size:12px;margin-top:8px">This appointment is less than 24 hours away and can no longer be rescheduled. Please contact us directly.</p>' : ''}
      <div id="reschedule-panel-${b.id}"></div>
      <div id="addon-panel-${b.id}"></div>
    `;
    list.appendChild(card);
    const payBtn = card.querySelector(`[data-pay-now="${b.id}"]`);
    if (payBtn) payBtn.onclick = async () => {
      const errEl = $(`#pay-err-${b.id}`, card);
      errEl.style.display = 'none';
      payBtn.disabled = true;
      try {
        const res = await fetch(`/api/bookings/${b.id}/checkout`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not start payment');
        window.location.href = data.url;
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        payBtn.disabled = false;
      }
    };
    const btn = card.querySelector(`[data-reschedule="${b.id}"]`);
    btn.onclick = async () => {
      await loadSchedule();
      state.reschedulingId = state.reschedulingId === b.id ? null : b.id;
      state.selectedDate = null;
      state.selectedTime = null;
      render();
    };
    const addonBtn = card.querySelector(`[data-addon-toggle="${b.id}"]`);
    if (addonBtn) addonBtn.onclick = () => {
      state.addonPanelId = state.addonPanelId === b.id ? null : b.id;
      render();
    };
    if (state.reschedulingId === b.id) {
      renderReschedulePanel(card.querySelector(`#reschedule-panel-${b.id}`), b);
    }
    if (state.addonPanelId === b.id) {
      renderAddonPanel(card.querySelector(`#addon-panel-${b.id}`), b);
    }
  });
}

function monthCalendarHtml(scheduledDate, scheduledTime) {
  const target = new Date(String(scheduledDate).slice(0, 10) + 'T00:00:00');
  const year = target.getFullYear(), month = target.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = target.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const dayLabels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  return `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e3ded2">
      <p style="font-size:13px;font-weight:500;margin:0 0 10px">${monthLabel}</p>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;max-width:280px">
        ${dayLabels.map(l => `<span class="muted" style="font-size:11px">${l}</span>`).join('')}
        ${cells.map(d => `<span style="font-size:12.5px;padding:6px 0;border-radius:4px;${d === target.getDate() ? 'background:#b68235;color:#153238;font-weight:600' : (d ? 'color:#3d4a4d' : '')}">${d || ''}</span>`).join('')}
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px">Scheduled for ${target.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}${scheduledTime ? ' at ' + scheduledTime : ''}</p>
    </div>
  `;
}

function addonOptionsFor(booking) {
  const purchasedNames = new Set((booking.addons || []).map(a => a.name));
  const options = (booking.addons || []).map(a => ({ name: a.name, price: a.unitPrice, alreadyOwned: true }));
  if (booking.page === 'residential') {
    Object.keys(RESIDENTIAL_ADDON_CATALOG).forEach(name => {
      if (!purchasedNames.has(name)) options.push({ name, price: RESIDENTIAL_ADDON_CATALOG[name], alreadyOwned: false });
    });
  }
  return options;
}

function renderAddonPanel(container, booking) {
  const options = addonOptionsFor(booking);
  const selected = state.addonSelection[booking.id] || {};
  const selectedTotal = Object.values(selected).reduce((s, p) => s + p, 0);
  container.innerHTML = `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e3ded2">
      <p style="font-size:13px;font-weight:500;margin:0 0 4px">Add an add-on to this booking</p>
      <p class="muted" style="font-size:12px;margin:0 0 8px">Charged immediately to this booking's total.</p>
      ${options.map(o => `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
          <input type="checkbox" data-addon-name="${o.name}" ${selected[o.name] != null ? 'checked' : ''} />
          ${o.name}${o.alreadyOwned ? ' <span class="muted" style="font-size:11px">(more of this)</span>' : ''}
          <span class="muted" style="margin-left:auto">+${money(o.price)}</span>
        </label>
      `).join('')}
      ${booking.page === 'commercial' ? `<p class="muted" style="font-size:12px;margin-top:6px">Want a service not listed here? <a href="mailto:hello@gulfproclean.com" style="color:#8a6221">Contact us</a> for accurate pricing based on your property.</p>` : ''}
      <div class="error" id="addon-err-${booking.id}" style="display:none"></div>
      <button id="confirm-addon-${booking.id}" ${selectedTotal > 0 ? '' : 'disabled'}>${selectedTotal > 0 ? `Add & charge ${money(selectedTotal)}` : 'Select an add-on'}</button>
    </div>
  `;
  container.querySelectorAll('[data-addon-name]').forEach(cb => {
    cb.onchange = (e) => {
      const name = e.target.getAttribute('data-addon-name');
      const opt = options.find(o => o.name === name);
      if (!state.addonSelection[booking.id]) state.addonSelection[booking.id] = {};
      if (e.target.checked) state.addonSelection[booking.id][name] = opt.price;
      else delete state.addonSelection[booking.id][name];
      render();
    };
  });
  const confirmBtn = $(`#confirm-addon-${booking.id}`, container);
  if (confirmBtn) confirmBtn.onclick = async () => {
    const errEl = $(`#addon-err-${booking.id}`, container);
    errEl.style.display = 'none';
    confirmBtn.disabled = true;
    try {
      const extraAddons = Object.entries(state.addonSelection[booking.id] || {}).map(([name, price]) => ({ name, price }));
      const res = await fetch(`/api/bookings/${booking.id}/addons`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ extraAddons }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      state.addonSelection[booking.id] = {};
      state.addonPanelId = null;
      await loadBookings();
      render();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      confirmBtn.disabled = false;
    }
  };
}

function renderReschedulePanel(container, booking) {
  const days = nextAvailableDays(state.schedule, 14);
  const selectedDay = days.find(d => d.date.toDateString() === (state.selectedDate && state.selectedDate.toDateString()));
  container.innerHTML = `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e3ded2">
      <label>Choose a new day</label>
      <div class="day-grid">
        ${days.map(d => {
          const hasSlots = availableTimeSlots(d.date, d.cfg).length > 0;
          const isSelected = selectedDay && selectedDay.date.toDateString() === d.date.toDateString();
          return `<button type="button" class="day-btn ${isSelected ? 'selected' : ''}" data-date="${d.date.toISOString()}" ${hasSlots ? '' : 'disabled'}>${DAY_LABELS[d.key]}<br>${d.date.getMonth() + 1}/${d.date.getDate()}</button>`;
        }).join('')}
      </div>
      ${selectedDay ? `
        <label>Choose a new time</label>
        <select id="reschedule-time-${booking.id}">
          <option value="">Select a time</option>
          ${availableTimeSlots(selectedDay.date, selectedDay.cfg).map(t => `<option value="${t}" ${state.selectedTime === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      ` : '<p class="muted" style="font-size:13px">Pick a day to see available times.</p>'}
      <div class="error" id="reschedule-err-${booking.id}" style="display:none"></div>
      <button id="confirm-reschedule-${booking.id}" ${selectedDay && state.selectedTime ? '' : 'disabled'}>Confirm new time</button>
    </div>
  `;
  container.querySelectorAll('.day-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = new Date(btn.getAttribute('data-date'));
      state.selectedTime = null;
      render();
    };
  });
  const timeSel = $(`#reschedule-time-${booking.id}`, container);
  if (timeSel) timeSel.onchange = (e) => { state.selectedTime = e.target.value; render(); };
  const confirmBtn = $(`#confirm-reschedule-${booking.id}`, container);
  if (confirmBtn) confirmBtn.onclick = async () => {
    const errEl = $(`#reschedule-err-${booking.id}`, container);
    errEl.style.display = 'none';
    confirmBtn.disabled = true;
    try {
      const res = await fetch(`/api/bookings/${booking.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          scheduledDate: state.selectedDate.toISOString().slice(0, 10),
          scheduledTime: state.selectedTime,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      state.reschedulingId = null;
      state.selectedDate = null;
      state.selectedTime = null;
      await loadBookings();
      render();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      confirmBtn.disabled = false;
    }
  };
}

init();
</script>
</body>
</html>
