<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job description — Gulf ProClean</title>
<meta name="description" content="Full job description, pay range, requirements and physical demands for an open position at Gulf ProClean." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site-pages.css">
</head>
<body>
<div id="site-nav"></div>
<main class="wrap narrow" style="padding-top:40px;padding-bottom:40px;">
  <p style="font-size:13px;color:var(--muted);margin:0 0 26px;">
    <a href="careers.html" style="color:var(--gold-dark)">← All openings</a>
  </p>
  <div id="job"></div>
</main>
<div id="site-footer"></div>

<script src="site-chrome.js"></script>
<script src="careers-data.js"></script>
<script>
(function () {
  GPC_CHROME.mount('careers.html');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function list(title, items) {
    if (!items || !items.length) return '';
    return '<h2 class="sec" style="margin-top:40px;font-size:24px;">' + title + '</h2><ul class="ticks">' +
      items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
  }

  var slug = new URLSearchParams(location.search).get('role');
  var job = GPC_JOBS.filter(function (j) { return j.slug === slug; })[0];
  var el = document.getElementById('job');

  if (!job) {
    el.innerHTML = '<h1 class="page">That posting isn\'t open</h1>' +
      '<p class="lead">It may have been filled, or the link may be out of date. ' +
      '<a href="careers.html" style="color:var(--gold-dark)">See what is open now →</a></p>';
    return;
  }

  document.title = job.title + ' — Gulf ProClean careers';

  el.innerHTML = '' +
    '<span class="kicker">Now hiring</span>' +
    '<h1 class="page" style="font-size:clamp(30px,4.2vw,44px)">' + esc(job.title) + '</h1>' +
    '<p class="pay" style="font-size:24px;margin-top:16px;">$' + job.payMin + '–$' + job.payMax +
      ' <span style="font-size:14px;font-weight:400;color:var(--muted)">/ ' + esc(job.payUnit) + '</span></p>' +
    '<div style="margin-top:16px;">' +
      '<span class="pill">' + esc(job.type) + '</span>' +
      '<span class="pill">' + esc(job.schedule) + '</span>' +
      '<span class="pill">' + esc(job.location) + '</span>' +
      (job.drives ? '<span class="pill">Driving required</span>' : '') +
    '</div>' +
    '<p class="lead">' + esc(job.summary) + '</p>' +
    '<p style="margin-top:28px;"><a class="btn" href="apply.html?role=' + encodeURIComponent(job.slug) + '">Apply for this role</a></p>' +
    list('What you will do', job.responsibilities) +
    list('What we need from you', job.requirements) +
    list('Nice to have', job.preferred) +
    list('Physical demands', job.physical) +
    '<div class="notice" style="margin-top:40px;">' +
      '<strong>Before you apply, so nothing is a surprise:</strong> this role is contingent on a criminal background check and on verifying your authorization to work in the United States. ' +
      'Both happen <em>after</em> we make you a conditional offer, not now — and the background check only runs once you have signed a written authorization. ' +
      '<a href="careers-process.html" style="color:var(--gold-dark)">See exactly what we check and how we decide →</a>' +
    '</div>' +
    '<p class="legal" style="margin-top:24px;">Gulf ProClean is an equal opportunity employer and does not discriminate on the basis of race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, genetic information, marital status, veteran status, or any other protected characteristic. Employment is at will. Reasonable accommodation is available on request at any stage of the hiring process. The pay range above reflects what we expect to pay for this role; actual pay depends on experience.</p>' +
    '<p style="margin-top:30px;"><a class="btn" href="apply.html?role=' + encodeURIComponent(job.slug) + '">Apply for this role</a> ' +
      '<a class="btn-ghost" href="careers.html" style="margin-left:10px;">See other openings</a></p>';
})();
</script>
</body>
</html>
