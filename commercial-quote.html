<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get a commercial quote — Gulf ProClean</title>
<meta name="description" content="Estimate your commercial cleaning price from square footage, restroom count and service frequency, then book online." />
<script src="./ds-base.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Libre Franklin', system-ui, sans-serif; text-wrap: pretty; background: #f5f2ec; }
  a { text-decoration: none; }
  #root { min-height: 100vh; }
  @media (max-width: 720px) {
    nav { flex-wrap: wrap; row-gap: 6px !important; column-gap: 14px !important; padding: 12px 20px !important; font-size: 12.5px !important; }
    .calc-two-col { grid-template-columns: 1fr !important; }
    table { font-size: 13px; }
    .addons-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    nav { column-gap: 10px !important; font-size: 11.5px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Every marketing page is assembled from the same JSX modules plus its own
// app-script. They are concatenated and evaluated as ONE script on purpose:
// `const` declarations inside an indirect eval stay in that eval's own lexical
// scope, so separate evals would not see each other's constants.
(async () => {
  const MODULES = ["gulfproclean-shared.jsx", "commercial-sections.jsx"];
  try {
    const parts = await Promise.all(MODULES.map(p => fetch(p).then(r => {
      if (!r.ok) throw new Error('could not load ' + p);
      return r.text();
    })));
    parts.push(document.getElementById('app-script').textContent);
    const code = Babel.transform(parts.join('\n'), { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(code);
  } catch (e) {
    console.error('page failed to load:', e);
    document.getElementById('root').innerHTML =
      '<p style="padding:56px 24px;font:16px/1.6 system-ui;color:#153238">This page could not load. Please refresh, or <a href="contact.html" style="color:#8a6221">contact us</a>.</p>';
  }
})();
</script>
<script type="text/plain" id="app-script">

function Page() {
  const pricing = usePricing('commercial', DEFAULT_PRICING_COMMERCIAL);
  const content = useSiteContent('commercial', DEFAULT_CONTENT_COMMERCIAL);
  const preset = usePlanPreset();
  const [booking, setBooking] = React.useState("Subscription");
  return (
    <SectionPage side="commercial" current="commercial-quote.html">
      <Calculator navy={NAVY} gold={GOLD} pricing={pricing} preset={preset} />
      <Quote navy={NAVY} text={content.quote.text} caption={content.quote.caption} />
    </SectionPage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);

</script>
</body>
</html>
